<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor JS con Vista Previa HTML</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f0f2f5;
        }
        h1, h2 { color: #333; }
        
        textarea {
            width: 90%;
            height: 150px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 14px;
            border-radius: 4px;
            resize: vertical;
        }

        .input-area {
            width: 90%;
            margin-bottom: 10px;
            padding: 15px;
            border: 1px solid #c3e6cb;
            background-color: #d4edda;
            display: none; /* Inicialmente oculto */
            flex-direction: column;
            border-radius: 5px;
        }
        .input-area label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #155724;
        }
        .input-area input {
            padding: 8px;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .input-area button {
            padding: 8px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            align-self: flex-end;
        }
        .input-area button:hover {
            background-color: #218838;
        }

        .button-container {
            width: 90%;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button.main-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button.main-btn:hover {
            background-color: #0056b3;
        }
        button.reset-button {
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button.reset-button:hover {
            background-color: #c82333;
        }

        /* Consola de texto */
        .resultado {
            margin-top: 5px;
            width: 90%;
            border: 1px solid #333;
            padding: 10px;
            background-color: #222;
            color: #0f0; /* Texto verde tipo hacker */
            font-family: monospace;
            white-space: pre-wrap;
            height: 100px; /* Altura fija */
            overflow-y: auto;
            border-radius: 4px;
        }

        /* --- NUEVO ESTILO PARA EL CONTENEDOR VISIBLE --- */
        #iframe-container {
             display: block; /* Hacemos visible el bloque */
             width: 90%;
             height: 300px; /* Altura para ver el HTML */
             border: 2px solid #999;
             background-color: white;
             margin-top: 10px;
             box-shadow: 0 4px 6px rgba(0,0,0,0.1);
             border-radius: 4px;
             overflow: hidden; /* Para que el iframe no se salga */
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .section-label {
            width: 90%;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
            color: #555;
        }

    </style>
</head>
<body>

    <h1>Editor JS + Vista HTML</h1>

    <textarea id="javascriptCode" spellcheck="false">// Ejemplo: Interactuando con HTML y Consola

console.log("Iniciando aplicación...");

// 1. Modificar el HTML visible
document.body.style.fontFamily = "sans-serif";
document.body.style.padding = "20px";
document.body.innerHTML = `
  <h1 style='color: blue'>Hola Mundo HTML</h1>
  <p>Esto se genera desde JavaScript.</p>
  <div id='caja' style='background: #eee; padding: 10px;'>Esperando input...</div>
`;

// 2. Usar la función paso a paso
let nombre = await solicitarEntrada("¿Cuál es tu nombre?");

console.log("Nombre recibido: " + nombre);

// 3. Actualizar el HTML con el dato
document.getElementById('caja').innerHTML = 
  "Bienvenido, <b>" + nombre + "</b>!";
document.getElementById('caja').style.backgroundColor = "#d1ecf1";
</textarea>

     <div class="button-container">
        <button id="ejecutarButton" class="main-btn" onclick="ejecutarCodigo()">Ejecutar Código</button>
        <button class="reset-button" onclick="resetEditor()">Reiniciar</button>
     </div>

    <!-- Área para entradas dinámicas -->
    <div id="dynamicInputArea" class="input-area">
        <label id="inputLabel" for="dynamicInput">Introduce un valor:</label>
        <input type="text" id="dynamicInput" autocomplete="off">
        <button onclick="enviarEntrada()">Enviar</button>
    </div>

    <div class="section-label">Consola (Logs):</div>
    <pre class="resultado" id="output"></pre>

    <div class="section-label">Vista Previa HTML (Resultado Visual):</div>
    <!-- Contenedor para el Iframe VISIBLE -->
    <div id="iframe-container">
        <!-- El iframe se creará dinámicamente aquí -->
    </div>


    <script>
        let currentCode = ''; 
        let executionPaused = false; 
        let currentPromiseId = null; 
        const iframeContainer = document.getElementById('iframe-container');
        let sandboxIframe = null; 

        window.addEventListener('message', handleIframeMessage);

        function resetEditor() {
            console.log("Iniciando resetEditor...");

            document.getElementById('output').textContent = '';
            document.getElementById('output').scrollTop = 0;

            document.getElementById('dynamicInputArea').style.display = 'none';
            document.getElementById('dynamicInput').value = ''; 

            const ejecutarButton = document.getElementById('ejecutarButton');
            ejecutarButton.textContent = 'Ejecutar Código';
            
            // Habilitar el botón de nuevo por si estaba deshabilitado
            ejecutarButton.disabled = false;
            ejecutarButton.style.opacity = "1";

            currentCode = ''; 
            executionPaused = false; 
            currentPromiseId = null; 

            if (sandboxIframe) {
                 try {
                     iframeContainer.removeChild(sandboxIframe);
                 } catch (e) {
                     console.error("Error al remover iframe:", e);
                 }
            }

            const newIframe = document.createElement('iframe');
            newIframe.id = 'sandbox'; 
            
            // --- CAMBIO IMPORTANTE: NO OCULTAMOS EL IFRAME ---
            // Eliminamos style.display = 'none' y width/height = 0
            // Ahora el iframe tomará el tamaño del CSS #iframe-container iframe
            
            iframeContainer.appendChild(newIframe);
            sandboxIframe = newIframe;

            console.log("Nuevo entorno HTML/JS listo.");
        }


        async function ejecutarCodigo() {
            const outputElement = document.getElementById('output');
            const dynamicInputArea = document.getElementById('dynamicInputArea');
            const ejecutarButton = document.getElementById('ejecutarButton');

            if (!executionPaused) {
                console.log("Iniciando nueva ejecución...");
                currentCode = document.getElementById('javascriptCode').value; 

                if (!currentCode.trim()) {
                     outputElement.textContent = "No hay código para ejecutar.";
                     return; 
                }

                dynamicInputArea.style.display = 'none';
                
                // Aseguramos iframe limpio
                resetEditor(); 

                 setTimeout(() => {
                     if (!sandboxIframe || !sandboxIframe.contentDocument) {
                         outputElement.textContent += '\nError: El entorno no está listo.';
                         return; 
                     }

                    const scriptTag = `
                        <script>
                            window._pendingPromises = {};
                            let promiseCounter = 0; 

                            const originalConsoleLog = console.log;
                            console.log = function(...args) {
                                let message = args.map(arg => {
                                    if (typeof arg === 'object' && arg !== null) {
                                        try { return JSON.stringify(arg, null, 2); } 
                                        catch (e) { return String(arg); }
                                    }
                                    return String(arg);
                                }).join(' ');
                                window.parent.postMessage({ type: 'log', message: message }, '*');
                            };

                            window.onerror = function(message, source, lineno, colno, error) {
                                window.parent.postMessage({ type: 'error', message: \`Error: \${message} en línea \${lineno}\` }, '*');
                                return true;
                            };

                            window.solicitarEntrada = async function(mensaje = 'Introduce un valor:') {
                                const promiseId = 'promise_' + promiseCounter++;
                                const promise = new Promise(resolve => {
                                    window._pendingPromises[promiseId] = { resolve: resolve };
                                });
                                window.parent.postMessage({ type: 'solicitar_entrada', mensaje: mensaje, promiseId: promiseId }, '*');
                                return promise;
                            };

                            window.addEventListener('message', function(event) {
                                const data = event.data;
                                if (event.source === window.parent) { 
                                    if (data.type === 'entrada_recibida') {
                                        const promiseId = data.promiseId;
                                        const value = data.value;
                                        if (window._pendingPromises && window._pendingPromises[promiseId]) {
                                            const resolve = window._pendingPromises[promiseId].resolve;
                                            delete window._pendingPromises[promiseId]; 
                                            resolve(value); 
                                        }
                                    }
                                }
                            });

                            (async () => {
                                try {
                                    // NO limpiamos el body aquí para permitir que el JS escriba sobre blanco
                                    console.log("Ejecutando...");
                                    ${currentCode}
                                    console.log("Ejecución finalizada.");
                                } catch (e) {
                                    window.parent.postMessage({ type: 'error', message: \`Error de ejecución: \${e.message}\` }, '*');
                                } finally {
                                    window.parent.postMessage({ type: 'ejecucion_completa' }, '*');
                                }
                            })();
                        <\/script>
                    `;
                     try {
                          sandboxIframe.contentDocument.open();
                          sandboxIframe.contentDocument.write(scriptTag);
                          sandboxIframe.contentDocument.close();
                     } catch (e) {
                         console.error("Error inject:", e);
                         outputElement.textContent += '\nError crítico al inyectar código.';
                     }
                 }, 50);

            } else {
                 enviarEntrada(); 
            }
        }

        function handleIframeMessage(event) {
            const data = event.data;
            const outputElement = document.getElementById('output');
            const dynamicInputArea = document.getElementById('dynamicInputArea');
            const inputLabel = document.getElementById('inputLabel');
            const dynamicInput = document.getElementById('dynamicInput');
            const ejecutarButton = document.getElementById('ejecutarButton');

             if (!sandboxIframe || event.source !== sandboxIframe.contentWindow) return;

            if (data.type === 'log') {
                outputElement.textContent += '> ' + data.message + '\n';
                outputElement.scrollTop = outputElement.scrollHeight;

            } else if (data.type === 'error') {
                 outputElement.textContent += '❌ ' + data.message + '\n';
                 outputElement.scrollTop = outputElement.scrollHeight;
                 dynamicInputArea.style.display = 'none';
                 ejecutarButton.textContent = 'Ejecutar Código';
                 executionPaused = false; 
                 currentPromiseId = null;

            } else if (data.type === 'solicitar_entrada') {
                executionPaused = true;
                currentPromiseId = data.promiseId;
                inputLabel.textContent = data.mensaje;
                dynamicInputArea.style.display = 'flex';
                dynamicInput.value = '';
                dynamicInput.focus();
                ejecutarButton.textContent = 'Enviar Entrada'; // Botón cambia de función visualmente

            } else if (data.type === 'ejecucion_completa') {
                 dynamicInputArea.style.display = 'none';
                 ejecutarButton.textContent = 'Ejecutar Código';
                 executionPaused = false; 
                 currentPromiseId = null;
            }
        }

        function enviarEntrada() {
            const dynamicInputArea = document.getElementById('dynamicInputArea');
            const dynamicInput = document.getElementById('dynamicInput');
            const inputValue = dynamicInput.value;

            if (executionPaused && currentPromiseId !== null && sandboxIframe) {
                 sandboxIframe.contentWindow.postMessage({ type: 'entrada_recibida', value: inputValue, promiseId: currentPromiseId }, '*');
                 dynamicInputArea.style.display = 'none';
                 currentPromiseId = null; 
            }
        }

        document.getElementById('dynamicInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter' && executionPaused) {
                event.preventDefault();
                enviarEntrada();
            }
        });

         window.addEventListener('load', () => {
            resetEditor(); 
         });

    </script>
</body>
</html>
